<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#33415c" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Cadence" />
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="icons/icon-180.png" />
  <link rel="icon" type="image/png" href="icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css" />
  <title>Cadence</title>
</head>
<body>
  <div class="app" id="app">
    <nav class="nav" id="nav" aria-label="Sections">
      <div class="brand"><span class="brand-mark"></span><span class="brand-name">Cadence</span></div>
      <button class="nav-item" data-view="today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M8 2.5v3M16 2.5v3"/><circle cx="12" cy="15" r="2.2" fill="currentColor" stroke="none"/></svg><span>Today</span></button>
      <button class="nav-item" data-view="week"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M9 9v12M15 9v12M3 15h18M9 2.5v3M15 2.5v3"/></svg><span>Week</span></button>
      <button class="nav-item" data-view="shopping"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 4h2l2.4 12.2a2 2 0 0 0 2 1.6h7.7a2 2 0 0 0 2-1.6L23 8H6"/><circle cx="10" cy="21" r="1.4" fill="currentColor" stroke="none"/><circle cx="18" cy="21" r="1.4" fill="currentColor" stroke="none"/></svg><span>Shopping</span></button>
      <button class="nav-item" data-view="streaks"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20V13M9.3 20V8M14.7 20v-6M20 20V5"/></svg><span>Streaks</span></button>
      <button class="nav-item" data-view="template"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="17" rx="2.5"/><path d="M3 9h18M9 21V9"/></svg><span>Template</span></button>
      <button class="nav-item" data-view="settings"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12M6 8a2.5 2.5 0 1 1 0 .01M15 16H3M15 16a2.5 2.5 0 1 0 5 0 2.5 2.5 0 0 0-5 0"/><path d="M18 8h3M3 16h1"/></svg><span>Settings</span></button>
      <div class="nav-foot"><span class="sync-pill" id="syncPill">local only</span></div>
    </nav>
    <main class="main" id="main"></main>
  </div>

  <div class="scrim" id="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
  <div class="toast" id="toast" hidden></div>

  <script src="sync.js"></script>
  <script src="app.js"></script>
</body>
</html>
